<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="arr12b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d0793a"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="15" y="220" width="220" height="100" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="125" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">One delivery</text>
  <text x="125" y="277" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">engineered feature</text>
  <text x="125" y="294" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">vector (Section VI-B)</text>

  <!-- fan-out lines to model cluster -->
  <g stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#arr12)">
    <path d="M235,240 C 320,90 380,60 430,52"/>
    <path d="M235,250 C 320,140 380,120 430,112"/>
    <path d="M235,260 C 320,190 380,175 430,172"/>
    <path d="M235,268 C 330,235 380,230 430,232"/>
    <path d="M235,275 C 330,270 380,272 430,292"/>
    <path d="M235,282 C 330,320 380,335 430,352"/>
    <path d="M235,290 C 320,375 380,405 430,412"/>
    <path d="M235,298 C 320,430 380,455 430,472"/>
  </g>

  <!-- model cluster boxes -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="430" y="30" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="56" fill="#152c47">B1 Run Projection</text>

    <rect x="430" y="90" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="116" fill="#152c47">B2 Dismissal Risk</text>

    <rect x="430" y="150" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="176" fill="#152c47">B3 Shot Aggr.</text>

    <rect x="430" y="210" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="236" fill="#152c47">B5 Strike Rot.</text>

    <rect x="430" y="270" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="296" fill="#152c47">B6 Partnership</text>

    <rect x="430" y="330" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="356" fill="#152c47">B13 Wicket-Loss</text>

    <rect x="430" y="390" width="150" height="44" rx="6" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="505" y="416" fill="#152c47">B15 Death-Over</text>

    <rect x="430" y="450" width="150" height="44" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="505" y="476" font-size="11.5" fill="#444">+ 6 more B-models</text>
  </g>

  <!-- dashed cluster boundary -->
  <rect x="415" y="18" width="180" height="468" rx="14" fill="none" stroke="#3b6ea5" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="505" y="10" text-anchor="middle" font-size="12" fill="#152c47" font-weight="bold">~13 role-relevant batting models fire in parallel</text>

  <!-- fan-in lines to raw outputs box -->
  <g stroke="#d0793a" stroke-width="1.6" fill="none" marker-end="url(#arr12b)">
    <path d="M598,52 C 700,70 800,110 860,235"/>
    <path d="M598,112 C 700,120 800,150 860,240"/>
    <path d="M598,172 C 720,180 800,200 860,246"/>
    <path d="M598,232 C 750,235 810,236 860,252"/>
    <path d="M598,292 C 750,290 810,285 860,265"/>
    <path d="M598,352 C 720,330 800,300 860,272"/>
    <path d="M598,412 C 700,370 800,320 860,280"/>
    <path d="M598,472 C 700,420 800,340 860,290"/>
  </g>

  <!-- raw outputs box -->
  <rect x="860" y="200" width="230" height="120" rx="8" fill="#fbeee2" stroke="#d0793a" stroke-width="2"/>
  <text x="975" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3f16">raw_model_outputs</text>
  <text x="975" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">{ "B1": 152.3, "B2": 0.41,</text>
  <text x="975" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">...  ~13 scalars }</text>
  <text x="975" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#555">passed as one dict</text>

  <!-- to decision engine -->
  <g stroke="#555555" stroke-width="2.2" marker-end="url(#arr12)">
    <line x1="1090" y1="260" x2="1215" y2="260"/>
  </g>
  <rect x="1220" y="205" width="250" height="110" rx="8" fill="#eaf3ec" stroke="#3a8f5a" stroke-width="2"/>
  <text x="1345" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5c37">DecisionEngine</text>
  <text x="1345" y="268" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">.decide(role,</text>
  <text x="1345" y="286" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">raw_model_outputs,</text>
  <text x="1345" y="304" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">match_state)</text>

  <text x="750" y="515" text-anchor="middle" font-size="13" fill="#444">
    Fig. 12. One delivery's feature vector fans out to every role-relevant batting model; each model's single scalar output fans back in as one dict entry.
  </text>
</svg>
