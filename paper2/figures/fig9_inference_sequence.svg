<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- lifeline headers -->
  <g font-size="13.5" text-anchor="middle" font-weight="bold">
    <rect x="20" y="15" width="220" height="52" rx="7" fill="#eaf3ec" stroke="#3a8f5a" stroke-width="1.8"/>
    <text x="130" y="37" fill="#1f5c37">ScorecardPanel</text>
    <text x="130" y="54" font-size="11" font-weight="normal" fill="#333">(React console)</text>

    <rect x="330" y="15" width="220" height="52" rx="7" fill="#fbeee2" stroke="#d0793a" stroke-width="1.8"/>
    <text x="440" y="37" fill="#7a3f16">FastAPI</text>
    <text x="440" y="54" font-size="11" font-weight="normal" fill="#333">POST /api/recommend</text>

    <rect x="640" y="15" width="220" height="52" rx="7" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="750" y="37" fill="#1f3d5c">live_state.py</text>
    <text x="750" y="54" font-size="11" font-weight="normal" fill="#333">feature engineering</text>

    <rect x="950" y="15" width="240" height="52" rx="7" fill="#eaf1f8" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="1070" y="37" fill="#1f3d5c">model_runner.py</text>
    <text x="1070" y="54" font-size="11" font-weight="normal" fill="#333">28 loaded models</text>

    <rect x="1260" y="15" width="220" height="52" rx="7" fill="#fbeee2" stroke="#d0793a" stroke-width="1.8"/>
    <text x="1370" y="37" fill="#7a3f16">DecisionEngine</text>
    <text x="1370" y="54" font-size="11" font-weight="normal" fill="#333">decide()</text>
  </g>

  <!-- lifelines -->
  <g stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4,3">
    <line x1="130" y1="67" x2="130" y2="740"/>
    <line x1="440" y1="67" x2="440" y2="740"/>
    <line x1="750" y1="67" x2="750" y2="740"/>
    <line x1="1070" y1="67" x2="1070" y2="740"/>
    <line x1="1370" y1="67" x2="1370" y2="740"/>
  </g>

  <!-- messages -->
  <g font-size="12" fill="#222">
    <line x1="130" y1="110" x2="435" y2="110" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="140" y="102">1. ball-by-ball log + role + venue/teams</text>

    <line x1="440" y1="155" x2="745" y2="155" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="450" y="147">2. compute live match state</text>

    <line x1="750" y1="200" x2="445" y2="200" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="460" y="192">3. engineered feature vector</text>

    <line x1="440" y1="245" x2="1065" y2="245" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="450" y="237">4. features (role-relevant subset)</text>

    <line x1="1070" y1="315" x2="1070" y2="315" stroke="#444" stroke-width="1.8"/>
    <rect x="1000" y="275" width="140" height="60" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <text x="1070" y="298" text-anchor="middle" font-size="11">run ~15 role-</text>
    <text x="1070" y="313" text-anchor="middle" font-size="11">relevant models</text>
    <text x="1070" y="328" text-anchor="middle" font-size="10.5" fill="#666">(Fig. 11)</text>

    <line x1="1070" y1="355" x2="445" y2="355" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="460" y="347">5. 15 raw model scalars</text>

    <line x1="440" y1="400" x2="1365" y2="400" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="450" y="392">6. raw_model_outputs + match_state</text>

    <rect x="1300" y="440" width="140" height="80" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <text x="1370" y="463" text-anchor="middle" font-size="11">normalize &#8594;</text>
    <text x="1370" y="478" text-anchor="middle" font-size="11">weight &#8594;</text>
    <text x="1370" y="493" text-anchor="middle" font-size="11">aggregate &#8594;</text>
    <text x="1370" y="508" text-anchor="middle" font-size="11">validate</text>

    <line x1="1370" y1="550" x2="445" y2="550" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="460" y="542">7. chosen action + ranked list + audit + contributions</text>

    <line x1="440" y1="620" x2="135" y2="620" stroke="#444" stroke-width="1.8" marker-end="url(#arr9)"/>
    <text x="150" y="612">8. JSON recommendation</text>

    <rect x="60" y="655" width="500" height="60" rx="6" fill="#eaf3ec" stroke="#3a8f5a" stroke-width="1.2"/>
    <text x="310" y="678" text-anchor="middle" font-size="11.5">Console renders: chosen action, confidence,</text>
    <text x="310" y="694" text-anchor="middle" font-size="11.5">alternatives, per-model contribution chart</text>
  </g>

  <text x="750" y="750" text-anchor="middle" font-size="13" fill="#444">
    Fig. 9. Live-inference request sequence for one strategic-timeout recommendation.
  </text>
</svg>
